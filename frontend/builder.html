<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Builder - Alpha Quest</title>
    <style>
        body {
            background-color: #0A1E3D; 
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            margin: 0;
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
        }
        h1 { color: #C9A84C; text-align: center; margin-bottom: 10px; }
        
        /* XP Bar */
        .level-display { font-size: 1.4rem; color: #C9A84C; font-weight: bold; margin-bottom: 5px; }
        .xp-bar-container {
            width: 100%; max-width: 400px; height: 20px; background-color: #2D3748;
            border-radius: 10px; margin-bottom: 15px; overflow: hidden; border: 2px solid #C9A84C;
        }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #C9A84C, #F6E27A); width: 0%; transition: width 0.8s; }
        .xp-display { font-size: 1.2rem; margin-bottom: 20px; background-color: #1A4B8C; padding: 10px 30px; border-radius: 10px; font-weight: bold; }

        /* Toolbar */
        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;
        }
        .tool-btn {
            background-color: #1A4B8C; color: white; border: 2px solid #2D3748; 
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .tool-btn.selected { border-color: #C9A84C; background-color: #2D3748; box-shadow: 0 0 10px #C9A84C; transform: scale(1.05); }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Grid Map */
        .grid-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            background-color: #2D3748;
            padding: 15px;
            border-radius: 15px;
            border: 3px dashed #C9A84C;
            margin-bottom: 30px;
        }
        .grid-tile {
            width: 60px;
            height: 60px;
            background-color: #1A202C;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #4A5568;
        }
        .grid-tile:hover { background-color: #2D3748; border-color: #C9A84C; }
        .grid-tile.occupied { cursor: default; background-color: #1A4B8C; border-color: #C9A84C; }
        .grid-tile.occupied:hover { transform: scale(1.05); }

        .back-link { color: #C9A84C; text-decoration: none; font-size: 1.2rem; margin-bottom: 50px; display: inline-block; }
    </style>
</head>
<body>

    <h1>Knowledge Builder</h1>
    
    <div class="level-display" id="level-text">Level 1</div>
    <div class="xp-bar-container">
        <div class="xp-bar-fill" id="xp-bar"></div>
    </div>
    <div class="xp-display">
        Your XP: <span id="player-xp">0</span>
    </div>

    <!-- Toolbar to select building -->
    <div class="toolbar">
        <button class="tool-btn" onclick="selectBuilding('Library', 50, '📚', this)">📚 Library (50 XP)</button>
        <button class="tool-btn" onclick="selectBuilding('Science Lab', 150, '🔬', this)">🔬 Science Lab (150 XP)</button>
        <button class="tool-btn" onclick="selectBuilding('Math Tower', 300, '📐', this)">📐 Math Tower (300 XP)</button>
    </div>

    <!-- The Grid -->
    <div class="grid-map" id="build-grid">
        <!-- JavaScript will generate the 20 tiles here -->
    </div>

    <a href="/" class="back-link">← Back to Home</a>

    <script src="builder.js"></script>
</body>
</html>
