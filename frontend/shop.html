<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Shop - Alpha Quest</title>
    <style>
        body {
            background-color: #0A1E3D; /* Navy */
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            margin: 0;
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
        }
        h1 { color: #C9A84C; margin-bottom: 10px; }
        
        .xp-display {
            font-size: 1.4rem;
            margin-bottom: 30px;
            background-color: #1A4B8C;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid #C9A84C;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .avatar-card {
            background-color: #1A4B8C;
            border: 2px solid #2D3748;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-card:hover { transform: translateY(-5px); border-color: #C9A84C; }
        
        .avatar-icon {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .avatar-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .avatar-cost { color: #C9A84C; font-weight: bold; margin-bottom: 15px; }
        
        .buy-btn {
            background-color: #48BB78;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .buy-btn:hover { background-color: #38A169; }
        .buy-btn:disabled { background-color: #555; cursor: not-allowed; opacity: 0.6; }
        
        .owned-badge {
            background-color: #C9A84C;
            color: #0A1E3D;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }

        .back-link {
            color: #C9A84C;
            text-decoration: none;
            font-size: 1.2rem;
            margin-bottom: 50px;
            display: inline-block;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>🛍️ Avatar Shop</h1>
    
    <div class="xp-display">
        Your XP: <span id="player-xp">0</span>
    </div>

    <div class="shop-grid" id="shop-grid">
        <!-- JavaScript will load avatars here -->
    </div>

    <a href="/" class="back-link">← Back to Home</a>

    <script src="shop.js"></script>
</body>
</html>
