<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Quest</title>
    <style>
        body {
            background-color: #0A1E3D;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #C9A84C;
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #F4F6F9;
            margin-bottom: 30px;
        }
        .start-button {
            background-color: #1A4B8C;
            color: #FFFFFF;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            width: 100%;
            max-width: 300px;
        }
        .start-button:hover {
            background-color: #C9A84C;
            color: #0A1E3D;
        }
        .leaderboard-link {
            color: #F4F6F9; 
            text-decoration: none; 
            font-size: 1.1rem; 
            opacity: 0.8;
            display: inline-block;
            margin-top: 20px;
        }
        .leaderboard-link:hover {
            color: #C9A84C;
            opacity: 1;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1rem; }
            .start-button { padding: 12px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div>
        <h1>ALPHA QUEST</h1>
        <p>Learn. Explore. Achieve.</p>
        
        <input type="text" id="nickname-input" placeholder="Enter your nickname" style="padding: 10px; font-size: 1rem; border-radius: 5px; border: none; margin-bottom: 15px; text-align: center; width: 250px;">
        <br>
        
        <button class="start-button" id="start-btn" onclick="startGame()">Start Your Journey</button>
        
        <br>
        <a href="/leaderboard.html" class="leaderboard-link">View Leaderboard 🏆</a>
        
        <div id="game-screen" style="display: none; margin-top: 30px; width: 100%; max-width: 600px;">
            <h2 id="question-text" style="color: #FFFFFF; font-size: 1.5rem;"></h2>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 20px;"></div>
            <p id="feedback-text" style="margin-top: 20px; font-size: 1.2rem; font-weight: bold;"></p>
            <button id="next-btn" onclick="nextQuestion()" style="display: none; margin-top: 20px; padding: 10px 20px; background-color: #C9A84C; color: #0A1E3D; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; font-weight: bold;">Next Question</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
