<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Quest</title>
    <style>
        /* Base styles using Alpha Quest brand colors */
        body {
            background-color: #0A1E3D; /* Navy */
            color: #FFFFFF; /* White */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #C9A84C; /* Gold */
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #F4F6F9; /* Light Gray */
            margin-bottom: 30px;
        }
        .start-button {
            background-color: #1A4B8C; /* Blue */
            color: #FFFFFF;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .start-button:hover {
            background-color: #C9A84C; /* Gold on hover */
            color: #0A1E3D; /* Navy text on hover */
        }
    </style>
</head>
<body>

    <div>
        <h1>ALPHA QUEST</h1>
        <p>Learn. Explore. Achieve.</p>
        <button class="start-button">Start Your Journey</button>
    </div>

</body>
</html>
