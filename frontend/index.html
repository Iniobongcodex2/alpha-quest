<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Quest</title>
    <style>
        body {
            background-color: #0A1E3D;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #C9A84C;
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #F4F6F9;
            margin-bottom: 30px;
        }
        .start-button {
            background-color: #1A4B8C;
            color: #FFFFFF;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
            width: 100%;
            max-width: 300px;
        }
        .start-button:hover {
            background-color: #C9A84C;
            color: #0A1E3D;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .leaderboard-link {
            color: #F4F6F9; 
            text-decoration: none; 
            font-size: 1.1rem; 
            opacity: 0.8;
            display: inline-block;
            transition: color 0.3s;
        }
        .leaderboard-link:hover {
            color: #C9A84C;
            opacity: 1;
        }
        .teacher-link {
            color: #F4F6F9; 
            text-decoration: none; 
            font-size: 0.9rem; 
            opacity: 0.5;
            margin-top: 15px;
            display: inline-block;
        }
        .teacher-link:hover { opacity: 0.9; }

        /* --- WORLD MAP STYLES --- */
        .world-map {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        .world-card {
            background-color: #1A4B8C;
            border: 2px solid #C9A84C;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
        }
        .world-card:hover {
            transform: scale(1.05);
            background-color: #2D3748;
        }
        .world-card .icon { font-size: 2rem; margin-bottom: 5px; }
        .world-card .name { font-size: 0.9rem; font-weight: bold; }
        
        /* Make the last card span the full width */
        .world-card.all-worlds { grid-column: span 2; background-color: #C9A84C; color: #0A1E3D; border-color: #FFFFFF; }
        .world-card.all-worlds:hover { background-color: #E2C26B; }

        /* --- MISSION BRIEFING MODAL --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 30, 61, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1A4B8C;
            border: 3px solid #C9A84C;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-title { color: #C9A84C; font-size: 1.8rem; margin-bottom: 15px; }
        .modal-story { color: #F4F6F9; font-size: 1.1rem; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn {
            background-color: #C9A84C;
            color: #0A1E3D;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .modal-btn:hover { background-color: #E2C26B; }

        /* --- GAME ANIMATIONS --- */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        .pop { animation: pop 0.3s ease-in-out; }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1rem; }
            .start-button { padding: 12px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div>
        <h1>ALPHA QUEST</h1>
        <p>Learn. Explore. Achieve.</p>
        
        <input type="text" id="nickname-input" placeholder="Enter your nickname" style="padding: 10px; font-size: 1rem; border-radius: 5px; border: none; margin-bottom: 15px; text-align: center; width: 250px;">
        <br>
        
        <!-- AVATAR SELECTOR -->
        <div style="margin-bottom: 15px;">
            <label style="font-size: 1.1rem; margin-right: 10px;">Avatar:</label>
            <select id="avatar-select" style="padding: 10px; font-size: 1.5rem; border-radius: 5px; border: none; cursor: pointer;">
                <option value="🦊">🦊 Fox</option>
                <option value="🦁">🦁 Lion</option>
                <option value="🦉">🦉 Owl</option>
                <option value="🐼">🐼 Panda</option>
                <option value="🦅">🦅 Eagle</option>
            </select>
        </div>

        <!-- WORLD MAP -->
        <p style="margin-bottom: 10px; font-weight: bold; font-size: 1rem;">Select a World to Explore:</p>
        <div class="world-map">
            <div class="world-card" onclick="showMissionBriefing('Math World', 'normal')">
                <div class="icon">🔢</div>
                <div class="name">Math World</div>
            </div>
            <div class="world-card" onclick="showMissionBriefing('English Kingdom', 'normal')">
                <div class="icon">📖</div>
                <div class="name">English Kingdom</div>
            </div>
            <div class="world-card" onclick="showMissionBriefing('Science Lab', 'normal')">
                <div class="icon">🔬</div>
                <div class="name">Science Lab</div>
            </div>
            <div class="world-card" onclick="showMissionBriefing('Discovery World', 'normal')">
                <div class="icon">🗺️</div>
                <div class="name">Discovery World</div>
            </div>
            <div class="world-card" onclick="showMissionBriefing('Logic Temple', 'normal')">
                <div class="icon">🧩</div>
                <div class="name">Logic Temple</div>
            </div>
            <div class="world-card all-worlds" onclick="showMissionBriefing('All', 'normal')">
                <div class="icon">🌍</div>
                <div class="name">Mixed Worlds (Random)</div>
            </div>
        </div>
        
        <button class="start-button" id="start-btn" onclick="showMissionBriefing('All', 'normal')">Start Your Journey</button>
        
        <!-- BOSS BATTLE BUTTON -->
        <button class="start-button" id="boss-btn" onclick="showMissionBriefing('All', 'boss')" style="background-color: #E53E3E; margin-top: 15px;">👹 Boss Battle (15 Questions)</button>
        
        <!-- BRAIN RUSH BUTTON -->
        <button class="start-button" id="rush-btn" onclick="showMissionBriefing('All', 'rush')" style="background-color: #9F7AEA; margin-top: 15px;">⚡ Brain Rush (Timed Mode)</button>
        
        <div class="nav-links">
            <a href="/leaderboard.html" class="leaderboard-link" id="lb-link">View Leaderboard 🏆</a>
            <a href="/rewards.html" class="leaderboard-link" id="rewards-link">View Rewards Room 🏅</a>
            <a href="/teacher.html" class="teacher-link">Teacher Studio 🔒</a>
        </div>
        
        <div id="game-screen" style="display: none; margin-top: 30px; width: 100%; max-width: 600px;">
            <!-- TIMER DISPLAY -->
            <div id="timer-container" style="display: none; margin-bottom: 15px;">
                <span style="font-size: 1.5rem; font-weight: bold; color: #E53E3E;">⏱️ Time: <span id="time-left">15</span>s</span>
            </div>
            
            <p id="progress-text" style="color: #C9A84C; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;"></p>
            <h2 id="question-text" style="color: #FFFFFF; font-size: 1.5rem;"></h2>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 20px;"></div>
            <p id="feedback-text" style="margin-top: 20px; font-size: 1.2rem; font-weight: bold;"></p>
            <button id="next-btn" onclick="nextQuestion()" style="display: none; margin-top: 20px; padding: 10px 20px; background-color: #C9A84C; color: #0A1E3D; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; font-weight: bold;">Next Question</button>
        </div>
    </div>

    <!-- MISSION BRIEFING MODAL -->
    <div id="mission-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" class="modal-title">Mission Title</h2>
            <p id="modal-story" class="modal-story">Mission story goes here...</p>
            <button id="modal-start-btn" class="modal-btn" onclick="beginQuiz()">Start Mission</button>
        </div>
    </div>

    <!-- Inline script to update links with the nickname -->
    <script>
        const nameInput = document.getElementById('nickname-input');
        const lbLink = document.getElementById('lb-link');
        const rewardsLink = document.getElementById('rewards-link');

        nameInput.addEventListener('input', () => {
            const name = nameInput.value.trim() || 'Explorer';
            lbLink.href = `/leaderboard.html?nickname=${encodeURIComponent(name)}`;
            rewardsLink.href = `/rewards.html?nickname=${encodeURIComponent(name)}`;
        });
    </script>
    
    <!-- Load the main game logic -->
    <script src="app.js"></script>
</body>
</html>
