<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Results - Alpha Quest</title>
    <style>
        body {
            background-color: #0A1E3D;
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .results-card {
            background-color: #1A4B8C;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid #C9A84C;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #C9A84C; font-size: 2.5rem; margin-bottom: 10px; }
        h2 { font-size: 1.5rem; margin-bottom: 30px; }
        .stat-box {
            background-color: #0A1E3D;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .stat-value { color: #C9A84C; font-weight: bold; font-size: 1.5rem; }
        
        .action-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-primary { background-color: #C9A84C; color: #0A1E3D; }
        .btn-secondary { background-color: #2D3748; color: #FFFFFF; }

        /* NEW: Review Section Styles */
        #review-section {
            display: none;
            margin-top: 25px;
            text-align: left;
            background-color: #0A1E3D;
            padding: 15px;
            border-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
        }
        #review-section h3 { color: #E53E3E; margin-top: 0; font-size: 1.2rem; text-align: center; }
        .mistake-item {
            background-color: #2D3748;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #E53E3E;
        }
        .mistake-prompt { font-weight: bold; font-size: 0.95rem; margin-bottom: 5px; }
        .mistake-answer { color: #48BB78; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        .mistake-explanation { font-size: 0.85rem; color: #A0AEC0; font-style: italic; }
    </style>
</head>
<body>

    <div class="results-card">
        <h1>Quest Complete!</h1>
        <h2 id="player-name">Explorer</h2>

        <div class="stat-box">
            Score: <span id="score-display" class="stat-value">0/0</span>
        </div>
        
        <div class="stat-box">
            XP Earned: <span id="xp-display" class="stat-value">+0</span>
        </div>

        <!-- NEW: Review Section -->
        <div id="review-section">
            <h3>Let's Review Your Mistakes</h3>
            <div id="mistakes-list"></div>
        </div>

        <a id="builder-link" href="#" class="action-btn btn-primary">Go to Knowledge Builder</a>
        <a href="/" class="action-btn btn-secondary">Back to Home</a>
    </div>

    <script src="results.js"></script>
</body>
</html>
